name: Build and Deploy Staging

on:
  push:
    branches:
      - main

env:
  DOCKER_COMPOSE_SERVICE_NAME: chatin-web
  IMAGE_NAME: chatin/web
  ENVIRONMENT: Staging
  APP_NAME: Chatin

jobs:
  notify-start:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get Commit Details
      run: |
        echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV
        echo "COMMIT_MESSAGE=$(git log -1 --pretty=%B | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')" >> $GITHUB_ENV
      
    - name: Notify Discord - Workflow Started
      run: |
        curl -X POST -H 'Content-Type: application/json' \
        --data '{
          "embeds": [
            {
              "title": "🚀 Pipeline Started for ${{ env.APP_NAME }} ${{ env.ENVIRONMENT }} Env 🚀",
              "color": 4431840,
              "fields": [
                {"name": "Workflow", "value": "[${{ github.workflow }} #${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})", "inline": true},
                {"name": "Repository", "value": "[${{ github.repository }}](https://github.com/${{ github.repository }})", "inline": true},
                {"name": "Branch", "value": "[${{ github.ref_name }}](https://github.com/${{ github.repository }}/tree/${{ github.ref_name }})", "inline": true},
                {"name": "Triggered By", "value": "[${{ github.actor }}](https://github.com/${{ github.actor }})", "inline": true},
                {"name": "Commit", "value": "[${{ env.SHORT_SHA }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})", "inline": true},
                {"name": "Commit Message", "value": "${{ env.COMMIT_MESSAGE }}", "inline": true}
              ],
              "footer": {"text": "by SLTR DevOps & Infra Team"}
            }
          ]
        }' \
        "${{ secrets.DISCORD_WEBHOOK_URL }}"

  build-chatin:
    needs: notify-start
    environment:
      name: staging
    runs-on: internal-tools
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Decode Config File
      run: echo -n "${{ secrets.CONFIG_STAGING }}" | base64 -d > .env

    - name: Docker Login
      uses: docker/login-action@v3
      with:
        registry: ${{ vars.LOCAL_DOCKER_REGISTRY }}
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker Image for Chatin Web
      run: |
        docker build -f Dockerfile \
        -t ${{ vars.LOCAL_DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
        -t ${{ vars.LOCAL_DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:staging .
     
    - name: Push Docker Image to Registry
      run: |
        docker push ${{ vars.LOCAL_DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        docker push ${{ vars.LOCAL_DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:staging
          
  deploy: 
    needs: build-chatin
    environment:
      name: staging
    runs-on: internal-tools
    steps: 
    - name: Docker Login
      uses: docker/login-action@v3
      with:
        registry: ${{ vars.LOCAL_DOCKER_REGISTRY }}
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Rollout restart deploy docker
      run: |
        docker compose -f /var/deployment/chatin/docker-compose.yaml down ${{ env.DOCKER_COMPOSE_SERVICE_NAME }}
        docker compose -f /var/deployment/chatin/docker-compose.yaml up -d ${{ env.DOCKER_COMPOSE_SERVICE_NAME }}

  cleanup:
    needs: [deploy]
    environment:
      name: staging
    runs-on: internal-tools
    steps:
      - name: Clean up local images
        run: |
            docker rmi ${{ vars.LOCAL_DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  notify-success:
    needs: [build-chatin, deploy]
    runs-on: ubuntu-latest
    if: success()
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get Commit Details
      run: |
        echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV
        echo "COMMIT_MESSAGE=$(git log -1 --pretty=%B | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')" >> $GITHUB_ENV
      
    - name: Notify Discord - Workflow Succeed
      run: |
        curl -X POST -H 'Content-Type: application/json' \
        --data '{
          "embeds": [
            {
              "title": "✅ Pipeline Succeeded for ${{ env.APP_NAME }} ${{ env.ENVIRONMENT }} Env ✅",
              "color": 3581519,
              "fields": [
                {"name": "Workflow", "value": "[${{ github.workflow }} #${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})", "inline": true},
                {"name": "Repository", "value": "[${{ github.repository }}](https://github.com/${{ github.repository }})", "inline": true},
                {"name": "Branch", "value": "[${{ github.ref_name }}](https://github.com/${{ github.repository }}/tree/${{ github.ref_name }})", "inline": true},
                {"name": "Triggered By", "value": "[${{ github.actor }}](https://github.com/${{ github.actor }})", "inline": true},
                {"name": "Commit", "value": "[${{ env.SHORT_SHA }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})", "inline": true},
                {"name": "Commit Message", "value": "${{ env.COMMIT_MESSAGE }}", "inline": true}
              ],
              "footer": {"text": "by SLTR DevOps & Infra Team"}
            }
          ]
        }' \
        "${{ secrets.DISCORD_WEBHOOK_URL }}"
          

  notify-fail:
    needs: [build-chatin, deploy]
    runs-on: ubuntu-latest
    if: failure()
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get Commit Details
      run: |
        echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV
        echo "COMMIT_MESSAGE=$(git log -1 --pretty=%B | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')" >> $GITHUB_ENV
      
    - name: Notify Discord - Workflow Failed
      run: |
        curl -X POST -H 'Content-Type: application/json' \
        --data '{
          "embeds": [
            {
              "title": "❌ Pipeline Failed for ${{ env.APP_NAME }} ${{ env.ENVIRONMENT }} Env ❌",
              "color": 16711680,
              "fields": [
                {"name": "Workflow", "value": "[${{ github.workflow }} #${{ github.run_number }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})", "inline": true},
                {"name": "Repository", "value": "[${{ github.repository }}](https://github.com/${{ github.repository }})", "inline": true},
                {"name": "Branch", "value": "[${{ github.ref_name }}](https://github.com/${{ github.repository }}/tree/${{ github.ref_name }})", "inline": true},
                {"name": "Triggered By", "value": "[${{ github.actor }}](https://github.com/${{ github.actor }})", "inline": true},
                {"name": "Commit", "value": "[${{ env.SHORT_SHA }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})", "inline": true},
                {"name": "Commit Message", "value": "${{ env.COMMIT_MESSAGE }}", "inline": true}
              ],
              "footer": {"text": "by SLTR DevOps & Infra Team"}
            }
          ]
        }' \
        "${{ secrets.DISCORD_WEBHOOK_URL }}"
